<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>𝐁𝐄𝐒𝐓𝐈𝐄_𝐌𝐈𝐍𝐈</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial, sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:
    radial-gradient(circle at 20% 20%,#d4af3730,transparent 28%),
    radial-gradient(circle at 80% 80%,#ffd96620,transparent 30%),
    #050505;
}

/* GOLD PARTICLES */
.particle{
    position:absolute;
    width:5px;
    height:5px;
    background:#d4af37;
    border-radius:50%;
    box-shadow:0 0 15px #d4af37;
    animation:float 6s infinite ease-in-out;
}

.p1{top:15%;left:12%;}
.p2{top:30%;right:15%;animation-delay:1s;}
.p3{bottom:20%;left:18%;animation-delay:2s;}
.p4{bottom:12%;right:20%;animation-delay:3s;}
.p5{top:55%;left:7%;animation-delay:4s;}
.p6{top:10%;right:30%;animation-delay:1.5s;}

@keyframes float{
    0%,100%{
        transform:translateY(0);
        opacity:.3;
    }
    50%{
        transform:translateY(-35px);
        opacity:1;
    }
}

/* MAIN */
.wrapper{
    width:92%;
    max-width:500px;
    position:relative;
    z-index:5;
}

.card{
    position:relative;
    padding:40px 25px 30px;
    text-align:center;

    background:rgba(15,15,15,.88);

    border:1px solid #d4af3766;
    border-radius:28px;

    box-shadow:
        0 0 30px #d4af3720,
        0 30px 80px #000;

    backdrop-filter:blur(15px);
}

/* GOLD TOP LINE */
.card:before{
    content:"";
    position:absolute;
    top:0;
    left:15%;
    width:70%;
    height:2px;

    background:linear-gradient(
        90deg,
        transparent,
        #d4af37,
        #fff1a8,
        #d4af37,
        transparent
    );

    box-shadow:0 0 20px #d4af37;
}

/* LOGO */
.logo{
    width:95px;
    height:95px;

    margin:0 auto 20px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #d4af3740,
        #111 65%
    );

    border:2px solid #d4af37;

    box-shadow:
        0 0 20px #d4af3755,
        inset 0 0 25px #d4af3725;

    animation:logoGlow 3s infinite;
}

.logo span{
    font-size:48px;
}

@keyframes logoGlow{
    50%{
        box-shadow:
        0 0 35px #d4af3780,
        inset 0 0 30px #d4af3740;
    }
}

/* TITLE */
h1{
    font-size:clamp(28px,7vw,40px);
    font-weight:900;

    color:#d4af37;

    text-shadow:
        0 0 10px #d4af3766,
        0 0 30px #d4af3722;
}

.subtitle{
    margin-top:8px;
    font-size:13px;
    letter-spacing:5px;
    color:#aaa;
}

/* DIVIDER */
.divider{
    width:100px;
    height:2px;

    margin:22px auto 28px;

    background:linear-gradient(
        90deg,
        transparent,
        #d4af37,
        transparent
    );

    box-shadow:0 0 12px #d4af37;
}

/* LINK BOX */
.link-box{
    display:flex;
    align-items:center;

    text-decoration:none;
    color:white;

    padding:18px;
    margin:16px 0;

    border-radius:18px;

    background:linear-gradient(
        145deg,
        #151515,
        #0b0b0b
    );

    border:1px solid #d4af3738;

    transition:.35s;

    position:relative;
    overflow:hidden;
}

.link-box:after{
    content:"";
    position:absolute;
    width:100px;
    height:200%;
    top:-50%;
    left:-150px;

    background:#ffffff10;

    transform:rotate(25deg);
    transition:.6s;
}

.link-box:hover:after{
    left:120%;
}

.link-box:hover{
    transform:translateY(-5px);

    border-color:#d4af37;

    box-shadow:
        0 10px 35px #000,
        0 0 20px #d4af3725;
}

/* ICON */
.icon{
    width:55px;
    height:55px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;

    background:#d4af3715;

    border:1px solid #d4af3755;

    font-size:27px;
}

/* TEXT */
.info{
    text-align:left;
    margin-left:15px;
}

.title{
    font-size:17px;
    font-weight:bold;

    color:#f1d77b;
}

.desc{
    font-size:11px;
    color:#777;
    margin-top:4px;
}

/* ARROW */
.arrow{
    margin-left:auto;

    font-size:25px;

    color:#d4af37;

    transition:.3s;
}

.link-box:hover .arrow{
    transform:translateX(6px);
}

/* FOOTER */
.footer{
    margin-top:27px;

    font-size:11px;

    color:#666;

    letter-spacing:1px;
}

.footer b{
    color:#d4af37;
}

/* MOBILE */
@media(max-width:400px){

    .card{
        padding:32px 18px 25px;
    }

    h1{
        font-size:27px;
    }

    .logo{
        width:82px;
        height:82px;
    }

    .logo span{
        font-size:40px;
    }

}
</style>
</head>

<body>

<!-- PARTICLES -->
<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>
<div class="particle p6"></div>


<div class="wrapper">

<div class="card">

    <!-- LOGO -->
    <div class="logo">
        <span>💚</span>
    </div>


    <!-- TITLE -->
    <h1>𝐁𝐄𝐒𝐓𝐈𝐄_𝐌𝐈𝐍𝐈</h1>

    <div class="subtitle">
        𝐌𝐀𝐈𝐍 𝐒𝐈𝐓𝐄
    </div>

    <div class="divider"></div>


    <!-- BOT -->
    <a
        href="https://cine-hub-production.up.railway.app"
        target="_blank"
        class="link-box"
    >

        <div class="icon">
            🤖
        </div>

        <div class="info">

            <div class="title">
                𝐁𝐎𝐓 𝐋𝐈𝐍𝐊
            </div>

            <div class="desc">
                Open Bestie Mini Bot
            </div>

        </div>

        <div class="arrow">
            ›
        </div>

    </a>


    <!-- API -->
    <a
        href="https://bestie-mini-api-site.vercel.app/"
        target="_blank"
        class="link-box"
    >

        <div class="icon">
            ⚡
        </div>

        <div class="info">

            <div class="title">
                𝐁𝐄𝐒𝐓𝐈𝐄 𝐀𝐏𝐈 𝐒𝐈𝐓𝐄
            </div>

            <div class="desc">
                Bestie API Developer Portal
            </div>

        </div>

        <div class="arrow">
            ›
        </div>

    </a>


    <!-- FOOTER -->
    <div class="footer">
        🧸 <b>𝐁𝐄𝐒𝐓𝐈𝐄_𝐌𝐈𝐍𝐈</b>
        • 𝐎𝐅𝐅𝐈𝐂𝐈𝐀𝐋 𝐒𝐈𝐓𝐄
    </div>

</div>

</div>

</body>
</html>
